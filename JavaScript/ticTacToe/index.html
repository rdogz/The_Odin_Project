<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Tic Tac Toe</title>
        <link href="./css/style.css" rel="stylesheet">
        <link href="./css/reset.css" rel="stylesheet">
        <script src="./script/script.js" defer></script>
    </head>
    <body>
        <div  class="header">
            <h1>Tic Tac Toe</h1>
            <button type="button" id="start-game">Start Game</button>
        </div>
        <div class="content">
            <div class="player">
                <form>
                    <p>Player X</p>
                    <input type="text" name="player1" value="Player 1">
                </form>
            </div>
            <div class="board"></div>
                <form>
                    <p>Player O</p>
                    <input type="text" name="player2" value="Player 2">
                </form>
        </div>
    </body>
</html>
