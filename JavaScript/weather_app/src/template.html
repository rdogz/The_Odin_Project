<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
  </head>
  <body>
    <div id="weather-form">
      <form id="input-data">
        <label for="input-city">City:</label>
        <input type="text" id="input-city" name="input-city" />
      </form>
      <button type="submit" form="input-data">Get Weather</button>
      <div class="toggle-temp">F°</div>
    </div>
    <div id="weather-div">
      <div id="weather-temperature"></div>
      <div id="weather-header"></div>
      <div id="weather-other"></div>
    </div>
  </body>
</html>
