<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title></title>
    </head>
    <body>
        <div id="sidebar">
            <div class="todo-logo">
                <img src="">
                <h1>TODO</h1>
            </div>
            <div class="add-project">
                <button command="show-modal" commandfor="add-project" class="new-book">+ Project</button>        
                <dialog id="add-project">
                    <form id="project-form">
                        <label for="project-name">Project title:</label>
                        <input type="text" name="project-name" required> 
                        <button type="submit">Add</button>
                    </form>
                </dialog>
            </div>
            
            <button type="button">Search</button>
            <div class="sidebar-project-container">
                <div class="project">
                    <h1>My projects</h1>
                    <button type="buton"># Default</button>
                </div>
            </div>
        </div>
        <div id="content">
            <div class="content-header">
                <h1>Project: Default</h1>
                <div class="add-task">
                <button command="show-modal" commandfor="add-task" class="new-task">+ Add task</button>        
                <dialog id="add-task">
                    <form id="task-form">
                        <label for="task-name">Task:</label>
                        <input type="text" name="task-name" required> 

                        <label for="task-description">Description:</label>
                        <textarea name="task-description" rows="5" cols="30"></textarea>

                        <label for="task-date">Due date:</label>
                        <input type="date" name="task-date" required> 

                        <label for="task-priority">Priority:</label>
                        <select name="task-priority">
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                        <button type="submit">Add</button>
                    </form>
                </dialog>
            </div>
            </div>
        </div>
    </body>
</html>
