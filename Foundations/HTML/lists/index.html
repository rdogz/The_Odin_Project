<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Lists</title>
    </head>
    <body>
        <!-- An unordered shopping list of your favorite foods -->
        <ul>
            <li>Strawberry</li>
            <li>Chocolate</li>
            <li>Coffee</li>
        </ul>
    
        <!-- An ordered list of todo’s you need to get done today -->
        <ol>
            <li>Finish The Odin Project foundations</li>
            <li>Make lunch</li>
            <li>Eat lunch</li>
        </ol>

        <!-- An unordered list of places you’d like to visit someday -->
        <ul>
            <li>Romance Empire (Italy)</li>
            <li>Canada</li>
            <li>Thailand</li>
        </ul>

        <!-- An ordered list of your all time top 5 favorite video games or movies -->
        <ol>
            <li>Baldur's Gate 3</li>
            <li>League of Legends</li>
            <li>The Walking Dead (Telltale)</li>
            <li>Dragon Age: Origins</li>
            <li>Dragon Age: Inquisition</li>
        </ol>
    </body>
</html>
